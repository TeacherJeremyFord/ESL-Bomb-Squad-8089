<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo } = React;
/* Solo test mode: open index.html?test. Adds the Manual button and SOLVE/STRIKE buttons on the bomb screen. Students never see it. */
const TEST_MODE = new URLSearchParams(location.search).has("test");

/* ===== UTILITIES ===== */
const generateSerialNumber = () => {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  const nums = "0123456789";
  const pick = (s) => s[Math.floor(Math.random() * s.length)];
  return `${pick(chars)}${pick(chars)}${pick(nums)}${pick(nums)}${pick(nums)}-${pick(chars)}${pick(nums)}${pick(chars)}${pick(nums)}${pick(nums)}`;
};
/* ===== BOMB FEATURES =====
   Things on the bomb itself that manual rules can point at, besides the serial number:
   its color, how many batteries it has, and one sticker. The Defuser sees pictures only (no words),
   so they have to say it in English: "The bomb is green. It has three batteries. There is a cat."
   Each feature is read by one module: color = Vending Machine, batteries = Big Button, sticker = Word Buttons. */
const BOMB_COLORS = { red:"#e04848", blue:"#3f6fd8", green:"#3f9e45", yellow:"#f7d843", purple:"#a65bd6" };
const BOMB_STICKERS = [...["cat","dog","bird","rabbit","monkey","tiger"].map(name=>({name,kind:"animal"})), ...["apple","banana","cake","egg","pizza","bread"].map(name=>({name,kind:"food"}))];
const makeBomb = () => { const pick=(a)=>a[Math.floor(Math.random()*a.length)]; return { color:pick(Object.keys(BOMB_COLORS)), batteries:1+Math.floor(Math.random()*4), sticker:pick(BOMB_STICKERS) }; };
const DEFAULT_BOMB = { color:"red", batteries:1, sticker:BOMB_STICKERS[0] }; /* for a module drawn outside a bomb (test pages) */
const stickerSrc = (st) => st.kind==="animal" ? PX.animal(st.name) : PX.food(st.name);
const batterySrc = (() => { let src=null; return () => src || (src = PX.render(8, 14, [{ sprite: PX.sprite("battery", ["..gggg..", ".yyyyyy.", ".yYYYYy.", ".GGGGGG.", ".GGGGGG.", ".GGWGGG.", ".GWWWGG.", ".GGWGGG.", ".GGGGGG.", ".GGGGGG.", ".GGGGGG.", ".GGGGGG.", ".GGGGGG.", "..GGGG.."]) }])); })();
const NUMBER_WORDS = ["zero","one","two","three","four","five"];

const getLastDigit = (sn) => parseInt(sn.replace(/[^0-9]/g, "").slice(-1)) || 0;
const getFirstDigit = (sn) => parseInt(sn.replace(/[^0-9]/g, "")[0]) || 0;
const getLastLetter = (sn) => sn.split("").filter(c => /[A-Z]/i.test(c)).pop()?.toUpperCase() || "A";
const getFirstLetter = (sn) => sn.split("").find(c => /[A-Z]/i.test(c))?.toUpperCase() || "A";
const getAllDigits = (sn) => sn.replace(/[^0-9]/g, "");
const countLetters = (sn) => sn.replace(/[^A-Z]/gi, "").length;

const MODULES_LIST = [
  { id:"colorWires", name:"🔌 Color Wires", type:"colorWires", difficulty:"A1" },
  { id:"userName", name:"👤 User Name", type:"userName", difficulty:"A1" },
  { id:"monsterLab", name:"👾 Monster Lab", type:"monsterLab", difficulty:"A1" },
  { id:"guessWho", name:"🕵️ Guess Who", type:"guessWho", difficulty:"A1" },
  { id:"vendingMachine", name:"🏭 Vending Machine", type:"vendingMachine", difficulty:"A1" },
  { id:"symbolKeypad", name:"🔣 Symbol Keypad", type:"symbolKeypad", difficulty:"A1" },
  { id:"numberKeypad", name:"🔢 Number Keypad", type:"numberKeypad", difficulty:"A2" },
  { id:"bigButton", name:"🔴 Big Button", type:"bigButton", difficulty:"A2" },
  { id:"sliders", name:"🎚️ Sliders", type:"sliders", difficulty:"A2" },
  { id:"crackTheCode", name:"🔐 Crack the Code", type:"crackTheCode", difficulty:"A2" },
  { id:"wordButtons", name:"📝 Word Buttons", type:"wordButtons", difficulty:"A2" },
  { id:"memory", name:"🧠 Memory", type:"memory", difficulty:"A2" },
  { id:"symbolPanel", name:"🎨 Symbol Panel", type:"symbolPanel", difficulty:"B1" },
  { id:"colorSwitchboard", name:"🎛️ Switchboard", type:"colorSwitchboard", difficulty:"B1" },
  { id:"worldClock", name:"🌍 World Clock", type:"worldClock", difficulty:"B1" },
  { id:"combinationLock", name:"🔒 Combo Lock", type:"combinationLock", difficulty:"B1" },
].concat((window.EXTRA_MODULES||[]).map(({id,name,type,difficulty})=>({id,name,type,difficulty})));

/* ===================== MODULES ===================== */

/* COLOR WIRES */
const ColorWiresModule = ({ serialNumber, onSuccess, onStrike }) => {
  const wireColors = ["red","blue","yellow","green","white","black"];
  const [wires] = useState(() => {
    const count = Math.floor(Math.random()*3)+3;
    const pick=(a)=>a[Math.floor(Math.random()*a.length)];
    // color decides the answer; bends, terminals, shade and how/where it gets cut are decoration, so no two wires look alike.
    return Array.from({length:count},(_,i)=>({id:i,color:pick(wireColors),cut:false,shape:pick(PX.wire.SHAPES),ends:pick(PX.wire.ENDS),tone:Math.random()*2-1,cutAt:0.25+Math.random()*0.5,gap:5+Math.floor(Math.random()*6),cutStyle:pick(PX.wire.CUTS)}));
  });
  const [wireState,setWireState] = useState(wires);
  const [solved,setSolved] = useState(false);
  const getCorrectWire = () => {
    const ld = getLastDigit(serialNumber); const hasRed = wires.some(w=>w.color==="red");
    if(wires.length===3){if(!hasRed)return 1;if(wires[wires.length-1].color==="white")return wires.length-1;if(wires.filter(w=>w.color==="blue").length>1)return wires.map(w=>w.color).lastIndexOf("blue");return wires.length-1;}
    else if(wires.length===4){if(wires.filter(w=>w.color==="red").length>1&&ld%2!==0)return wires.map(w=>w.color).lastIndexOf("red");if(wires[wires.length-1].color==="yellow"&&!hasRed)return 0;if(wires.filter(w=>w.color==="blue").length===1)return 0;if(wires.filter(w=>w.color==="yellow").length>1)return wires.length-1;return 1;}
    else{if(wires[wires.length-1].color==="black"&&ld%2!==0)return 3;if(wires.filter(w=>w.color==="red").length===1&&wires.filter(w=>w.color==="yellow").length>1)return 0;if(!wires.some(w=>w.color==="black"))return 1;return 0;}
  };
  const cutWire = (idx) => {
    if(solved||wireState[idx].cut)return;
    setWireState(ws=>ws.map((w,i)=>i===idx?{...w,cut:true}:w));
    if(idx===getCorrectWire()){setSolved(true);onSuccess();}else onStrike();
  };
  return (<div className="module-content" style={{display:"flex",flexDirection:"column",minHeight:"180px"}}><h3>🔌 COLOR WIRES</h3><p className="module-hint">Cut the correct wire!</p>
    <div className="wire-container">{wireState.map((w,i)=>(<button key={w.id} onClick={()=>cutWire(i)} disabled={solved||w.cut} className={`wire ${w.cut?"cut":""}`}><img className="pixel-art" alt={`${w.cut?"cut ":""}${w.color} wire`} src={PX.wire(w)} width={PX.wire.size.w*4} height={PX.wire.size.h*4}/></button>))}</div></div>);
};

/* USER NAME */
const UserNameModule = ({ serialNumber, onSuccess, onStrike }) => {
  const names={A:"ALICE",B:"BOB",C:"CHARLIE",D:"DAVID",E:"EVE",F:"FRANK",G:"GRACE",H:"HENRY",I:"IRIS",J:"JACK",K:"KATE",L:"LEO",M:"MARY",N:"NOAH",O:"OLIVE",P:"PETER",Q:"QUINN",R:"ROSE",S:"SAM",T:"TOM",U:"UMA",V:"VERA",W:"WILL",X:"XENA",Y:"YUKI",Z:"ZARA"};
  const correct = names[getLastLetter(serialNumber)]||"ALICE";
  // Typed, not chosen: the Expert has to spell the name out loud (design doc §2).
  const [text,setText] = useState("");
  const [solved,setSolved] = useState(false);
  const [wrong,setWrong] = useState(false);
  const submit = (e) => { e&&e.preventDefault(); if(solved||!text)return; if(text===correct){setSolved(true);onSuccess();} else {onStrike();setWrong(true);setTimeout(()=>setWrong(false),600);} };
  return (<div className="module-content"><h3>👤 USER NAME</h3><p className="module-hint">ENTER USER NAME</p>
    <form onSubmit={submit} style={{display:"flex",gap:"0.5rem"}}>
      <input value={text} onChange={e=>setText(e.target.value.toUpperCase().replace(/[^A-Z]/g,""))} disabled={solved} maxLength={12} autoCapitalize="characters" autoComplete="off" autoCorrect="off" spellCheck={false} placeholder="NAME"
        style={{flex:1,minWidth:0,padding:"0.6rem",fontSize:"1.3rem",fontFamily:"'Orbitron',sans-serif",letterSpacing:"3px",background:"#0a1520",color:solved?"#4caf50":"#0ff",border:`2px solid ${wrong?"#ff3b3b":solved?"#4caf50":"#333"}`,borderRadius:"4px"}}/>
      <button type="submit" disabled={solved||!text} className={`option-btn ${solved?"correct":""}`} style={{minWidth:"90px"}}>{solved?"✓":"SUBMIT"}</button>
    </form></div>);
};


/* MONSTER LAB */
const MonsterLabModule = ({ serialNumber, onSuccess, onStrike }) => {
  const monsterNames=["ZORG","BLIP","FLOP","MEEP"];
  const eyeCounts=[1,2,3,4]; const armTypes=["tentacles","robot","furry"]; const skinColors=["purple","green","orange"];
  
  const pick=(a)=>a[Math.floor(Math.random()*a.length)];
  // eyes / arms / color decide the answer; every other part is random decoration from the parts kit.
  const [monster] = useState(()=>{const P=PX.monster.PARTS;return{eyes:pick(eyeCounts),arms:pick(armTypes),color:pick(skinColors),head:pick(P.head),body:pick(P.body),legs:pick(P.legs),eyeStyle:pick(P.eyeStyle),mouth:pick(P.mouth),nose:pick(P.nose),horns:pick(P.horns)};});
  const ld = getLastDigit(serialNumber);
  const byEyes={1:"MEEP",2:"BLIP",3:"ZORG",4:"FLOP"}, byColor={purple:"ZORG",green:"BLIP",orange:"FLOP"}, byArms={tentacles:"BLIP",robot:"MEEP",furry:"FLOP"};
  const correct = ld<=2?byEyes[monster.eyes]:ld<=5?byColor[monster.color]:ld<=7?byArms[monster.arms]:monsterNames[monster.eyes%4];
  const [solved,setSolved] = useState(false);
  return (<div className="module-content"><h3>👾 MONSTER LAB</h3>
    <div className="monster-display"><img className="pixel-art" alt="monster" src={PX.monster(monster)} width={PX.monster.size.w*4} height={PX.monster.size.h*4}/></div>
    <div className="options-grid">{monsterNames.map(n=>(<button key={n} onClick={()=>{if(solved)return;if(n===correct){setSolved(true);onSuccess();}else onStrike();}} disabled={solved} className={`option-btn ${solved&&n===correct?"correct":""}`}>{n}</button>))}</div></div>);
};

/* GUESS WHO */
// gender + eyes + hair decide the name (2 × 3 × 5 = 30 names, one table per gender). The manual reads the same table.
const GUESS_EYES=["Brown","Blue","Green"]; const GUESS_HAIR=["Black","Brown","Blonde","Red","Gray"];
const GUESS_NAMES={
  boy:[["TOM","BEN","SAM","MAX","LEO"],["JACK","DAN","KEN","ROY","NED"],["TED","BOB","JIM","RAY","ZAC"]],
  girl:[["AMY","ANN","EVA","MAY","SUE"],["LILY","ROSE","KIM","JOY","MIA"],["ZOE","IVY","LIZ","PAM","DOT"]],
};
const GuessWhoModule = ({ serialNumber, onSuccess, onStrike }) => {
  const pick=(a)=>a[Math.floor(Math.random()*a.length)];
  // hairstyle and shirt are decoration.
  const [suspect] = useState(()=>{const gender=pick(["boy","girl"]);return{gender,eye:pick(GUESS_EYES),hair:pick(GUESS_HAIR),style:pick(gender==="girl"?["long","bun"]:["short","spiky"]),shirt:Math.floor(Math.random()*4)};});
  const ei=GUESS_EYES.indexOf(suspect.eye), hi=GUESS_HAIR.indexOf(suspect.hair);
  const correct = GUESS_NAMES[suspect.gender][ei][hi];
  // Always offer the other-gender twin (same eyes and hair), so "boy or girl?" matters.
  const twin = GUESS_NAMES[suspect.gender==="boy"?"girl":"boy"][ei][hi];
  const [options] = useState(()=>{const all=[...GUESS_NAMES.boy.flat(),...GUESS_NAMES.girl.flat()];const s=new Set([correct,twin]);while(s.size<4)s.add(pick(all));return[...s].sort(()=>Math.random()-0.5);});
  const [solved,setSolved] = useState(false);
  return (<div className="module-content"><h3>🕵️ GUESS WHO</h3>
    <div className="monster-display"><img className="pixel-art" alt="suspect" src={PX.face({gender:suspect.gender,hair:suspect.hair.toLowerCase(),eye:suspect.eye.toLowerCase(),style:suspect.style,shirt:suspect.shirt})} width={PX.face.size.w*4} height={PX.face.size.h*4} style={{maxWidth:"160px"}}/></div>
    <div className="options-grid">{options.map(n=>(<button key={n} onClick={()=>{if(solved)return;if(n===correct){setSolved(true);onSuccess();}else onStrike();}} disabled={solved} className={`option-btn ${solved&&n===correct?"correct":""}`} style={{fontSize:"1rem",minHeight:"48px",fontFamily:"'Orbitron',sans-serif",letterSpacing:"2px"}}>{n}</button>))}</div></div>);
};


/* VENDING MACHINE */
const VendingMachineModule = ({ bomb=DEFAULT_BOMB, onSuccess, onStrike }) => {
  const allItems=[{name:"Apple",cat:"fruit",price:150},{name:"Banana",cat:"fruit",price:100},{name:"Cookie",cat:"snack",price:175},{name:"Chips",cat:"snack",price:200},{name:"Soda",cat:"drink",price:125},{name:"Water",cat:"drink",price:75},{name:"Carrot",cat:"vegetable",price:150},{name:"Candy",cat:"snack",price:50}];
  const [items] = useState(()=>{const s=[...allItems].sort(()=>Math.random()-0.5);return s.slice(0,4);});
  // The bomb's color picks the rule. Every item that fits the rule is right; if none fits, the cheapest is (the manual says so).
  const prices=items.map(i=>i.price), cheapest=items.filter(i=>i.price===Math.min(...prices));
  const byColor={red:cheapest, blue:items.filter(i=>i.price===Math.max(...prices)), green:items.filter(i=>i.price>100&&i.price<200), yellow:items.filter(i=>i.cat!=="drink"), purple:items.filter(i=>i.price%100===50)};
  const good=(byColor[bomb.color]||[]).length?byColor[bomb.color]:cheapest;
  const isRight=(item)=>good.includes(item);
  const [solved,setSolved] = useState(false);
  const fmt = (p)=>`$${(p/100).toFixed(2)}`;
  return (<div className="module-content"><h3>🏭 VENDING MACHINE</h3><p className="module-hint">Buy the correct item!</p>
    <div className="options-grid">{items.map((item,i)=>(<button key={i} onClick={()=>{if(solved)return;if(isRight(item)){setSolved(item.name);onSuccess();}else onStrike();}} disabled={!!solved} className={`option-btn ${solved===item.name?"correct":""}`} style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"0.6rem"}}>
      <img className="pixel-art" alt="" src={PX.food(item.name.toLowerCase())} width={48} height={48}/><span style={{fontSize:"0.7rem"}}>{item.name}</span><span style={{fontSize:"0.65rem",color:"#f1c40f"}}>{fmt(item.price)}</span></button>))}</div></div>);
};

/* SYMBOL KEYPAD */
// Columns of PX.glyph names; the manual draws the same table.
const SYMBOL_COLUMNS=[["copyright","star","empty-star","diamonds"],["phone","star","flower","diamonds"],["copyright","phone","flower","empty-star"],["star","copyright","phone","flower"]];
const SymbolKeypadModule = ({ serialNumber, onSuccess, onStrike }) => {
  const columns=SYMBOL_COLUMNS;
  const [displayed] = useState(()=>{const col=columns[Math.floor(Math.random()*columns.length)];const shuffled=[...col].sort(()=>Math.random()-0.5);return{symbols:shuffled,correctOrder:col};});
  const [pressed,setPressed] = useState([]);
  const [solved,setSolved] = useState(false);
  const handlePress = (sym) => {
    if(solved||pressed.includes(sym))return;
    const nextCorrect = displayed.correctOrder[pressed.length];
    if(sym===nextCorrect){const np=[...pressed,sym];setPressed(np);if(np.length===4){setSolved(true);onSuccess();}}
    else{onStrike();setPressed([]);}
  };
  return (<div className="module-content"><h3>🔣 SYMBOL KEYPAD</h3><p className="module-hint">Press symbols in the correct order</p>
    <div style={{display:"flex",justifyContent:"center",gap:"0.5rem",marginBottom:"0.75rem"}}>{[0,1,2,3].map(i=>(<span key={i} style={{width:"28px",height:"28px",display:"flex",alignItems:"center",justifyContent:"center",background:"#1a1a2e",border:`2px solid ${pressed[i]?"#4caf50":"#333"}`,borderRadius:"6px",color:pressed[i]?"#4caf50":"#555",fontSize:"0.9rem"}}>{pressed[i]?<img className="pixel-art" alt={pressed[i]} src={PX.glyph(pressed[i])} width={20} height={20}/>:"?"}</span>))}</div>
    <div className="options-grid">{displayed.symbols.map(s=>(<button key={s} onClick={()=>handlePress(s)} disabled={solved||pressed.includes(s)} className={`symbol-btn ${pressed.includes(s)?"correct":""}`}><img className="pixel-art" alt={s} src={PX.glyph(s)} width={48} height={48}/></button>))}</div></div>);
};

/* NUMBER KEYPAD */
const NumberKeypadModule = ({ serialNumber, onSuccess, onStrike }) => {
  const ascending = getFirstLetter(serialNumber).charCodeAt(0)<=77;
  const correctOrder = ascending?"0123456789":"9876543210";
  const [input,setInput] = useState("");
  const [solved,setSolved] = useState(false);
  const handlePress = (num) => {
    if(solved)return; const next=input+num; setInput(next);
    if(next.length===10){if(next===correctOrder){setSolved(true);onSuccess();}else{onStrike();setInput("");}}
  };
  return (<div className="module-content"><h3>🔢 NUMBER KEYPAD</h3><p className="module-hint">Enter all digits in the correct order</p>
    <div className="keypad-display">{input||"_ _ _ _ _ _ _ _ _ _"}</div>
    <div className="keypad-grid">{[1,2,3,4,5,6,7,8,9,0].map(n=>(<button key={n} onClick={()=>handlePress(String(n))} disabled={solved||input.includes(String(n))} className={`keypad-btn ${input.includes(String(n))?"used":""}`}>{n}</button>))}</div>
    <button onClick={()=>setInput("")} className="clear-btn">Clear</button></div>);
};

/* BIG BUTTON */
const BigButtonModule = ({ bomb=DEFAULT_BOMB, onSuccess, onStrike }) => {
  const btnColors=["red","blue","yellow","white"]; const btnWords=["PRESS","HOLD","PUSH","CLICK"];
  const colorHex={red:"#e74c3c",blue:"#3498db",yellow:"#f1c40f",white:"#ecf0f1"};
  const [btnColor] = useState(()=>btnColors[Math.floor(Math.random()*4)]);
  const [btnWord] = useState(()=>btnWords[Math.floor(Math.random()*4)]);
  // Same order as the manual, first match wins: blue+HOLD = hold, red+PRESS = press, white = hold, 3 or 4 batteries = hold, otherwise press.
  const shouldHold = (btnColor==="blue"&&btnWord==="HOLD")?true:(btnColor==="red"&&btnWord==="PRESS")?false:btnColor==="white"?true:bomb.batteries>=3;
  const [holding,setHolding] = useState(false); const [holdTime,setHoldTime] = useState(0);
  const [solved,setSolved] = useState(false); const timerRef = useRef(null);
  // Pointer events, not mouse + touch: on a touch screen a tap fires both, which counted one wrong tap as two strikes.
  // The press is timed with a clock (downAt); holdTime is only for the on-screen counter.
  const downAt = useRef(null);
  const startHold = (e) => {
    if(solved||downAt.current!==null)return; downAt.current=Date.now(); setHolding(true); setHoldTime(0);
    try{e.currentTarget.setPointerCapture(e.pointerId);}catch(err){}
    timerRef.current = setInterval(()=>setHoldTime(Date.now()-downAt.current),100);
  };
  const endHold = () => {
    if(solved||downAt.current===null)return; const held=Date.now()-downAt.current; downAt.current=null;
    clearInterval(timerRef.current); setHolding(false);
    if(shouldHold&&held>=2000){setSolved(true);onSuccess();}
    else if(!shouldHold&&held<500){setSolved(true);onSuccess();}
    else{onStrike();setHoldTime(0);}
  };
  useEffect(()=>()=>clearInterval(timerRef.current),[]);
  return (<div className="module-content"><h3>🔴 BIG BUTTON</h3><p className="module-hint">Press or hold?</p>
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:"0.75rem"}}>
      <button onPointerDown={startHold} onPointerUp={endHold} onPointerCancel={endHold} onContextMenu={e=>e.preventDefault()} disabled={solved}
        style={{touchAction:"none",userSelect:"none",WebkitUserSelect:"none",WebkitTouchCallout:"none",width:"120px",height:"120px",borderRadius:"50%",border:"6px solid #333",background:colorHex[btnColor],cursor:solved?"default":"pointer",fontSize:"1rem",fontFamily:"'Orbitron',sans-serif",fontWeight:"bold",color:btnColor==="yellow"||btnColor==="white"?"#333":"#fff",transform:holding?"scale(0.95)":"scale(1)",boxShadow:holding?"0 4px 10px rgba(0,0,0,0.4)":"0 8px 20px rgba(0,0,0,0.4)",transition:"all 0.2s"}}>{btnWord}</button>
      {holding&&<div style={{background:shouldHold?"#3498db":"#e74c3c",padding:"0.3rem 1rem",borderRadius:"4px",fontSize:"0.8rem",color:"#fff"}}>{(holdTime/1000).toFixed(1)}s</div>}
      {solved&&<div style={{color:"#4caf50",fontFamily:"'Orbitron',sans-serif"}}>✓</div>}
    </div></div>);

/* CRACK THE CODE */
const CrackTheCodeModule = ({ serialNumber, onSuccess, onStrike }) => {
  const colors=["red","green","yellow","blue","white"];
  const colorHex={red:"#e74c3c",green:"#2ecc71",yellow:"#f1c40f",blue:"#3498db",white:"#ecf0f1"};

  const [guess,setGuess] = useState(["red","red","red"]);
  const [attempts,setAttempts] = useState([]);
  const [solved,setSolved] = useState(false);
  const getClues = (g) => {
    let correct=0,misplaced=0;const cCopy=[...code];const gCopy=[...g];
    for(let i=0;i<3;i++)if(gCopy[i]===cCopy[i]){correct++;cCopy[i]=null;gCopy[i]=null;}
    for(let i=0;i<3;i++)if(gCopy[i]){const j=cCopy.indexOf(gCopy[i]);if(j!==-1){misplaced++;cCopy[j]=null;}}
    return{correct,misplaced};
  };
  const handleSubmit = () => {
    if(solved)return; const clues=getClues(guess);
    setAttempts(a=>[...a,{guess:[...guess],clues}]);
    if(clues.correct===3){setSolved(true);onSuccess();}
    else if(attempts.length>=4)onStrike();
  };
  const cycleColor = (idx) => {
    if(solved)return; const ng=[...guess]; const ci=colors.indexOf(ng[idx]); ng[idx]=colors[(ci+1)%colors.length]; setGuess(ng);

        <span style={{fontSize:"0.7rem",color:"#4caf50"}}>●{a.clues.correct}</span>
        <span style={{fontSize:"0.7rem",color:"#f1c40f"}}>◐{a.clues.misplaced}</span>
      </div>))}
    </div>
    <div style={{display:"flex",gap:"0.3rem",justifyContent:"center",marginBottom:"0.5rem"}}>
      {guess.map((c,i)=>(<button key={i} onClick={()=>cycleColor(i)} disabled={solved} style={{width:"50px",height:"50px",borderRadius:"6px",background:colorHex[c],border:"2px solid #555",cursor:"pointer",fontSize:"0.6rem",color:c==="yellow"||c==="white"?"#333":"#fff"}}>{c}</button>))}
    </div>
    <button onClick={handleSubmit} disabled={solved} className={`submit-btn ${solved?"correct":""}`}>{solved?"✓ CRACKED":"GUESS ({5-attempts.length} left)"}</button></div>);
};

/* COMBINATION LOCK */
const CombinationLockModule = ({ serialNumber, onSuccess, onStrike }) => {
  const letterValues={A:5,B:12,C:25,D:33,E:8,F:18,G:15,H:22,I:30,J:7,K:19,L:35,M:10,N:27,O:3,P:14,Q:38,R:20,S:9,T:31,U:16,V:24,W:2,X:36,Y:11,Z:28};
  const fl = getFirstLetter(serialNumber);
  const digits = getAllDigits(serialNumber);
  const d1=parseInt(digits[0])||0; const d2=parseInt(digits[1])||0; const d3=parseInt(digits[2])||0;
  const n1 = (letterValues[fl]||5)%40;
  const n2 = (n1+d1+d2)%40;
  const n3 = (d2*3+d3)%40;
  const combo = [n1,n2,n3];
  const [dialPos,setDialPos] = useState(0);
  const [stage,setStage] = useState(0); // 0=right to n1, 1=left to n2, 2=right to n3
  const [solved,setSolved] = useState(false);
  const turnDial = (dir) => {// dir: 1=clockwise(right), -1=counter-clockwise(left)
    if(solved)return; setDialPos(p=>(p+dir+40)%40);
  };
  const tryUnlock = () => {
    if(solved)return;
    if(dialPos===combo[stage]){
      if(stage>=2){setSolved(true);onSuccess();}
      else setStage(s=>s+1);
    } else onStrike(); // a wrong try used to be free, so the dial could be tried number by number
  };
  return (<div className="module-content"><h3>🔒 COMBINATION LOCK</h3><p className="module-hint">Stage {stage+1}/3 — Turn {stage%2===0?"RIGHT":"LEFT"}</p>
    <div style={{textAlign:"center",margin:"0.5rem 0"}}>
      <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:"2.5rem",color:"#0ff"}}>{dialPos}</div>
      <div style={{display:"flex",justifyContent:"center",gap:"0.5rem",marginTop:"0.5rem"}}>
        <button onClick={()=>turnDial(-1)} className="clock-btn" style={{padding:"0.5rem 1rem"}}>◀ LEFT</button>
        <button onClick={()=>turnDial(1)} className="clock-btn" style={{padding:"0.5rem 1rem"}}>RIGHT ▶</button>
      </div>
      <div style={{display:"flex",justifyContent:"center",gap:"0.25rem",margin:"0.5rem 0"}}>{[0,1,2].map(i=>(<span key={i} style={{width:"12px",height:"12px",borderRadius:"50%",background:i<stage?"#4caf50":i===stage?"#ffcc00":"#333"}}></span>))}</div>
    </div>
    <button onClick={tryUnlock} disabled={solved} className={`submit-btn ${solved?"correct":""}`}>{solved?"✓ UNLOCKED":"TRY UNLOCK"}</button></div>);
};

/* ===== SOUND (Web Audio, no files). window.SFX is also free for modules to use. ===== */
const SFX = window.SFX = (() => {
  let ctx = null, muted = false;
  try { muted = localStorage.getItem("eslbomb-mute") === "1"; } catch (e) {}
  const ac = () => { try { if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); } if (ctx.state === "suspended") ctx.resume(); return ctx; } catch (e) { return null; } };
  const tone = (f, at, dur, type = "square", vol = 0.07, f2) => { const a = ac(); if (!a || muted) return; try {
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + at; o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03); } catch (e) {} };
  const noise = (at, dur, vol, cut) => { const a = ac(); if (!a || muted) return; try {
    const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + at; src.buffer = buf; fl.type = "lowpass";
    fl.frequency.setValueAtTime(cut, t); fl.frequency.exponentialRampToValueAtTime(60, t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(fl); fl.connect(g); g.connect(a.destination); src.start(t); } catch (e) {} };
  return {
    unlock: ac,
    isMuted: () => muted,
    setMuted: (m) => { muted = m; try { localStorage.setItem("eslbomb-mute", m ? "1" : "0"); } catch (e) {} },
    /* one clock tick. gap = seconds until the next tick, so the extra ticks fit however fast the clock runs */
    tick: (timeLeft, gap = 1) => { const f = timeLeft <= 10 ? 1500 : timeLeft <= 30 ? 1250 : 1000, n = timeLeft <= 10 ? 4 : timeLeft <= 30 ? 2 : 1, v = timeLeft <= 60 ? 0.06 : 0.03;
      for (let i = 0; i < n; i++) tone(f, i * gap / n, 0.045, "square", v); },
    count: () => tone(520, 0, 0.14, "square", 0.07),
    go: () => tone(1040, 0, 0.4, "square", 0.07),
    strike: () => { tone(160, 0, 0.45, "sawtooth", 0.14, 70); tone(113, 0, 0.45, "square", 0.08, 50); },
    defuse: () => { tone(660, 0, 0.12, "triangle", 0.12); tone(880, 0.11, 0.12, "triangle", 0.12); tone(1320, 0.22, 0.3, "triangle", 0.12); },
    win: () => { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * 0.13, i === 5 ? 0.7 : 0.14, "triangle", 0.13)); },
    unlockFinale: () => { tone(330, 0, 0.1, "square", 0.08); tone(440, 0.1, 0.1, "square", 0.08); tone(330, 0.2, 0.1, "square", 0.08); tone(660, 0.3, 0.35, "square", 0.08); },
    stars: (n) => { for (let i = 0; i < n; i++) tone(880 + i * 220, 0.6 + i * 0.45, 0.25, "triangle", 0.12); },
    alarm: () => { tone(1900, 0, 0.09, "square", 0.09); tone(1900, 0.14, 0.09, "square", 0.09); },
    needy: () => { tone(700, 0, 0.1, "sawtooth", 0.09); tone(700, 0.15, 0.1, "sawtooth", 0.09); tone(700, 0.3, 0.1, "sawtooth", 0.09); },
    lights: () => { tone(90, 0, 0.5, "sawtooth", 0.1, 40); },
    ok: () => tone(990, 0, 0.12, "triangle", 0.1),
    boom: () => { noise(0, 1.8, 0.6, 2500); tone(110, 0, 1.2, "sine", 0.35, 28); },
  };
})();

/* ===== SETTINGS / BOMB / WIN-LOSE / APP — same structure as before ===== */
/* fair shuffle (Fisher–Yates) for drawing a mission from the module pool */
const shuffled = (arr) => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const rankOf = (m) => ["A0","A1","A2","B1","B2"].indexOf(String(m.difficulty).slice(0,2));
/* setup list order: difficulty first, then A–Z by name (ignoring the emoji) */
const SORTED_MODULES = (() => { const rank=(m)=>rankOf(m), nm=(m)=>m.name.replace(/^[^A-Za-z]+/,"");
  return [...MODULES_LIST].sort((x,y)=>rank(x)-rank(y)||nm(x).localeCompare(nm(y))); })();
/* ===== CAMPAIGN =====
   One line per mission: edit freely. `modules` are module ids; the LAST one is the finale
   (it stays locked until the others are defused; needs 3 or more modules). `timer` is in seconds. */
const MISSIONS = [
  { id:"m1",  name:"First Bomb",       timer:300, modules:["colorWires","monsterLab"] },
  { id:"m2",  name:"Who Is It?",       timer:300, modules:["userName","colorWires","guessWho"] },
  { id:"m3",  name:"Snack Time",       timer:300, modules:["symbolKeypad","monsterLab","vendingMachine"] },
  { id:"m4",  name:"Number Day",       timer:300, modules:["numberKeypad","sliders","bigButton"] },
  { id:"m5",  name:"Family Day",       timer:420, modules:["wordButtons","guessWho","familyPhoto"] },
  { id:"m6",  name:"Lunch Time",       timer:420, modules:["vendingMachine","giftShop","lunchRush"] },
  { id:"m7",  name:"School Day",       timer:420, modules:["memory","messyDesk","schoolBell"] },
  { id:"m8",  name:"Rainy Day",        timer:420, modules:["crackTheCode","colorSwitchboard","weatherWardrobe"] },
  { id:"m9",  name:"City Trip",        timer:420, modules:["combinationLock","worldClock","ticketMachine"] },
  { id:"m10", name:"Night House",      timer:600, modules:["symbolPanel","moodPlugs","midnightSnack"] },
  { id:"m11", name:"Monster Hospital", timer:600, modules:["monsterLab","mysteryGuest","monsterClinic"] },
  { id:"m12", name:"The Big One",      timer:600, modules:["schoolBell","giftShop","ticketMachine","animalRace"] },
].map((m,i)=>({...m,num:i+1,modules:m.modules.filter(id=>MODULES_LIST.some(x=>x.id===id))}));

const TEAMS = [["🐯","TIGERS"],["🦁","LIONS"],["🐵","MONKEYS"],["🐻","BEARS"],["🐰","RABBITS"],["🐶","DOGS"],["🐱","CATS"],["🐦","BIRDS"],["🐟","FISH"],["🐘","ELEPHANTS"],["🐴","HORSES"],["🐸","FROGS"]];

/* saved on this device only (the devices are not linked) */
const STORE = {
  get:(k,d)=>{try{const v=localStorage.getItem("eslbomb-"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set:(k,v)=>{try{localStorage.setItem("eslbomb-"+k,JSON.stringify(v));}catch(e){}},
};
const fmtTime = (t) => `${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`;
/* stars: 1 for defusing the bomb, +1 for 0–1 mistakes, +1 for a quarter of the time still on the clock */
const fastTime = (timer) => Math.ceil(timer/4);
const starsFor = (r) => !r.win ? 0 : 1 + (r.strikes<=1?1:0) + (r.timeLeft>=fastTime(r.timer)?1:0);

/* Turn a spec into one bomb. Called again for every replay, so each bomb is a fresh draw.
   spec = {mission} for the campaign, or {timer,pool,count,finale} from free play. */
const buildMission = (spec) => {
  let order, hasFinale;
  if(spec.mission){ const ids=spec.mission.modules; order=[...shuffled(ids.slice(0,-1)),ids[ids.length-1]]; hasFinale=ids.length>=3; }
  else{
    let ids=shuffled(spec.pool).slice(0,spec.count);
    while(ids.length<spec.count)ids=[...ids,...shuffled(spec.pool).slice(0,spec.count-ids.length)]; /* pool smaller than the count: fill with copies, spread evenly */
    order=shuffled(ids); hasFinale=!!spec.finale&&order.length>=3;
    if(hasFinale){ /* the hardest module is the finale */ const r=(id)=>rankOf(MODULES_LIST.find(m=>m.id===id)); const top=order.reduce((a,b)=>r(b)>r(a)?b:a); const i=order.indexOf(top); order=[...order.slice(0,i),...order.slice(i+1),top]; }
  }
  /* each copy gets its own id so the bomb can tell copies apart */
  const modules=order.map((id,i)=>({...MODULES_LIST.find(m=>m.id===id),id:id+"#"+i,baseId:id}));
  return {timer:spec.mission?spec.mission.timer:spec.timer,modules,finaleId:hasFinale?modules[modules.length-1].id:null,mission:spec.mission||null,fun:!!spec.fun,spec};
};

const FUN_NOTE = "Alarm clock, lights out and a bomb quiz. Fun, but it takes time away from talking.";
const SettingsPanel = ({onStartGame,fun,setFun}) => {
  const [timer,setTimer]=useState(300);
  /* MODULES = how many go on the bomb. The pool (sel) = what the bomb is built from; it needs at least 1.
     - pool bigger than MODULES: the bomb draws that many at random, no repeats.
     - pool smaller than MODULES: every pool module goes on, then copies fill the rest (1 ticked, MODULES 6 = six copies).
     Raising MODULES ticks the next modules in list order (easiest first, then A–Z), unless the teacher has
     already cut the pool below the count on purpose; then it only adds copies. Lowering it never unticks anything. */
  /* (the draw itself is in buildMission) */
  const [pool,setPool]=useState({count:3,sel:SORTED_MODULES.slice(0,3).map(m=>m.id)});
  const {count:moduleCount,sel}=pool;
  const changeCount=(n)=>setPool(({count,sel})=>({count:n,sel:sel.length<count?sel:[...sel,...SORTED_MODULES.filter(m=>!sel.includes(m.id)).slice(0,Math.max(0,n-sel.length)).map(m=>m.id)]}));
  const toggle=(id)=>setPool(p=>p.sel.includes(id)?(p.sel.length<=1?p:{...p,sel:p.sel.filter(m=>m!==id)}):{...p,sel:[...p.sel,id]});
  const [finale,setFinale]=useState(true);
  const handleStart=()=>{SFX.unlock();onStartGame({timer,pool:sel,count:moduleCount,finale,fun});};
  const presets=[{l:"2:00",v:120},{l:"3:00",v:180},{l:"5:00",v:300},{l:"7:00",v:420},{l:"10:00",v:600}];
  return (<div className="settings-panel"><h2>⚙️ MISSION SETUP</h2>
    <div className="setting-group"><label>TIMER</label><div className="timer-selector">{presets.map(p=>(<button key={p.v} onClick={()=>setTimer(p.v)} className={`timer-btn ${timer===p.v?"active":""}`}>{p.l}</button>))}</div></div>
    <div className="setting-group"><label>MODULES: {moduleCount}</label><input type="range" min={1} max={10} value={moduleCount} onChange={e=>changeCount(Number(e.target.value))} className="module-slider"/></div>
    <div className="setting-group"><label>MODULE POOL ({sel.length} selected)</label>
      <p className="pool-note">{sel.length>moduleCount?`Each bomb gets ${moduleCount} of these ${sel.length} at random.`:sel.length===moduleCount?`Every bomb gets these ${moduleCount}. Add more for a random pick.`:sel.length===1?`Every bomb gets ${moduleCount} copies of this module.`:`Every bomb gets these ${sel.length}, plus ${moduleCount-sel.length} more ${moduleCount-sel.length===1?"copy":"copies"} to make ${moduleCount}.`}</p>
      <div className="module-toggles">{SORTED_MODULES.map(mod=>(<button key={mod.id} onClick={()=>toggle(mod.id)} className={`module-toggle ${sel.includes(mod.id)?"active":""} ${sel.length===1&&sel.includes(mod.id)?"locked":""}`}><span className="toggle-name">{mod.name}</span><span className="toggle-diff">{mod.difficulty}</span></button>))}</div></div>
    <div className="setting-group"><label>LAST MODULE</label><div className="timer-selector"><button onClick={()=>setFinale(true)} className={`timer-btn ${finale?"active":""}`}>🔒 LOCKED UNTIL THE END</button><button onClick={()=>setFinale(false)} className={`timer-btn ${!finale?"active":""}`}>ALL OPEN</button></div>
      <p className="pool-note" style={{marginTop:"0.5rem"}}>{finale?(moduleCount>=3?"The hardest module stays locked until the others are defused.":"Needs 3 or more modules, so this bomb has no lock."):"All modules can be played from the start."}</p></div>
    <div className="setting-group"><label>FUN MODE</label><div className="timer-selector"><button onClick={()=>setFun(false)} className={`timer-btn ${!fun?"active":""}`}>OFF</button><button onClick={()=>setFun(true)} className={`timer-btn ${fun?"active":""}`}>🎲 ON</button></div>
      <p className="pool-note" style={{marginTop:"0.5rem"}}>{FUN_NOTE}</p></div>
    <button onClick={handleStart} className="start-game-btn">🚀 START MISSION</button></div>);
};

/* ===== FUN MODE (off unless the teacher turns it on) =====
   Three KTANE-style interruptions. They are fun, but they take time away from talking, so they are never on by default.
   - Alarm clock: rings until someone taps it. No penalty.
   - Lights out: the modules go dark for a few seconds.
   - Bomb quiz: a yes/no question in English about the bomb (color, batteries, sticker). Wrong or too slow = a strike.
   In test mode (?test) everything comes much sooner. */
const funDelay = (a,b) => (a+Math.random()*(b-a))*1000*(TEST_MODE?0.12:1);
const makeBombQuestion = (bomb) => {
  const pick=(a)=>a[Math.floor(Math.random()*a.length)], truth=Math.random()<0.5, kind=pick(["color","batteries","sticker"]);
  if(kind==="color"){const c=truth?bomb.color:pick(Object.keys(BOMB_COLORS).filter(x=>x!==bomb.color));return{text:`Is the bomb ${c}?`,yes:truth};}
  if(kind==="batteries"){const n=truth?bomb.batteries:pick([1,2,3,4].filter(x=>x!==bomb.batteries));return{text:`Does the bomb have ${NUMBER_WORDS[n]} ${n===1?"battery":"batteries"}?`,yes:truth};}
  const st=truth?bomb.sticker:pick(BOMB_STICKERS.filter(x=>x.name!==bomb.sticker.name));
  return{text:`Is there ${/^[aeiou]/.test(st.name)?"an":"a"} ${st.name} on the bomb?`,yes:truth};
};
const QUIZ_SECONDS = 20;
const BombQuiz = ({bomb,active,onStrike}) => {
  const [q,setQ]=useState(null); /* null = asleep, or {text, yes, left} */
  useEffect(()=>{if(!active||q)return;const t=setTimeout(()=>{SFX.needy();setQ({...makeBombQuestion(bomb),left:QUIZ_SECONDS});},funDelay(25,45));return()=>clearTimeout(t);},[active,!q]);
  useEffect(()=>{if(!active||!q)return;if(q.left<=0){onStrike();setQ(null);return;}const t=setTimeout(()=>setQ(x=>x&&{...x,left:x.left-1}),1000);return()=>clearTimeout(t);},[active,q]);
  const answer=(yes)=>{if(!q)return;if(yes===q.yes)SFX.ok();else onStrike();setQ(null);};
  return (<div className={`module-wrapper quiz-box ${q?"awake":""}`}><div className="module-content"><h3>❓ BOMB QUIZ</h3>
    {q?(<div><p className="quiz-text">{q.text}</p><div className="quiz-bar"><span style={{width:`${q.left/QUIZ_SECONDS*100}%`}}></span></div>
      <div className="options-grid"><button className="option-btn" onClick={()=>answer(true)}>YES</button><button className="option-btn" onClick={()=>answer(false)}>NO</button></div></div>)
     :(<p className="quiz-sleep">💤</p>)}</div></div>);
};
const AlarmClock = ({active}) => {
  const [ringing,setRinging]=useState(false);
  useEffect(()=>{if(!active||ringing)return;const t=setTimeout(()=>setRinging(true),funDelay(40,70));return()=>clearTimeout(t);},[active,ringing]);
  useEffect(()=>{if(!active||!ringing)return;SFX.alarm();const t=setInterval(()=>SFX.alarm(),650);return()=>clearInterval(t);},[active,ringing]);
  return ringing?(<button className="alarm-clock" onClick={()=>setRinging(false)}><span>⏰</span>TAP!</button>):null;
};
/* returns true while the lights are out */
const useLightsOut = (on,active) => {
  const [dark,setDark]=useState(false);
  useEffect(()=>{if(!on||!active)return;const t=setTimeout(()=>{if(!dark)SFX.lights();setDark(d=>!d);},dark?4000:funDelay(50,80));return()=>clearTimeout(t);},[on,active,dark]);
  return on&&active&&dark;
};

const BombComponent = ({config,team,onGameEnd}) => {
  const [timeLeft,setTimeLeft]=useState(config.timer);const [strikes,setStrikes]=useState(0);const [completed,setCompleted]=useState([]);
  const [serialNumber]=useState(generateSerialNumber);const [gameStatus,setGameStatus]=useState("countdown");const [shake,setShake]=useState(false);const [countdown,setCountdown]=useState(3);const maxStrikes=3;const [muted,setMuted]=useState(SFX.isMuted());
  const [bomb]=useState(makeBomb); /* color, batteries, sticker */
  const dark=useLightsOut(!!config.fun,gameStatus==="playing");
  /* every strike makes the clock run faster: x1, x1.25, x1.5 */
  const speed=1+0.25*strikes;
  useEffect(()=>{if(gameStatus!=="countdown")return;if(countdown<=0){SFX.go();setGameStatus("playing");return;}SFX.count();const t=setTimeout(()=>setCountdown(c=>c-1),1000);return()=>clearTimeout(t);},[gameStatus,countdown]);
  useEffect(()=>{if(gameStatus!=="playing")return;const t=setInterval(()=>setTimeLeft(p=>{if(p<=1){setGameStatus("lost");return 0;}return p-1;}),1000/speed);return()=>clearInterval(t);},[gameStatus,speed]);
  useEffect(()=>{if(gameStatus==="playing"&&timeLeft>0&&timeLeft<config.timer)SFX.tick(timeLeft,1/speed);},[timeLeft]);
  useEffect(()=>{if(completed.length===config.modules.length&&config.modules.length>0&&gameStatus==="playing")setGameStatus("won");},[completed,config.modules.length,gameStatus]);
  const stats=useRef({}); /* per module: {strikes, solved} for the results screen */
  const stat=(id)=>stats.current[id]||(stats.current[id]={strikes:0,solved:false});
  useEffect(()=>{if(gameStatus!=="won"&&gameStatus!=="lost")return;const win=gameStatus==="won";if(win)SFX.win();else SFX.boom();
    onGameEnd({win,reason:win?null:strikes>=maxStrikes?"strikes":"time",timeLeft,timer:config.timer,strikes,funStrikes:stat("fun").strikes,modules:config.modules.map(m=>({name:m.name,...stat(m.id)}))});},[gameStatus]);
  const finaleLocked=!!config.finaleId&&completed.length<config.modules.length-1;
  useEffect(()=>{if(config.finaleId&&!finaleLocked&&gameStatus==="playing")SFX.unlockFinale();},[finaleLocked]);
  const strikesRef=useRef(0); /* a ref, so a module holding an old copy of onStrike still counts correctly */
  const handleStrike=(id)=>{if(strikesRef.current>=maxStrikes)return;stat(id).strikes++;const s=++strikesRef.current;SFX.strike();setStrikes(s);setShake(true);setTimeout(()=>setShake(false),500);if(s>=maxStrikes)setGameStatus("lost");};
  const tc=timeLeft<30?"#ff0000":timeLeft<60?"#ff8800":"#00ff00";
  return (<div className={`bomb-container ${shake?"shake":""}`} style={{borderColor:BOMB_COLORS[bomb.color],boxShadow:`0 0 0 4px ${BOMB_COLORS[bomb.color]},0 0 60px rgba(102,126,234,0.15),inset 0 0 60px rgba(0,0,0,0.3)`}}>
    {config.fun&&<AlarmClock active={gameStatus==="playing"}/>}
    {gameStatus==="countdown"&&<div className="countdown-overlay"><div className="countdown-number">{countdown>0?countdown:"GO!"}</div></div>}
    <div className="bomb-header"><div className="timer-display" style={{color:tc,textShadow:`0 0 15px ${tc}`}}>{Math.floor(timeLeft/60)}:{String(timeLeft%60).padStart(2,"0")}{strikes>0&&<span className="speed-badge">⏩ ×{speed}</span>}</div>
      <div className="serial-display">{team&&<div className="team-tag">{team[0]} {team[1]}{config.mission?` · MISSION ${config.mission.num}`:""}</div>}<span className="serial-label">SN:</span><span className="serial-value">{serialNumber}</span></div>
      <div className="bomb-plate"><span className="battery-row">{Array.from({length:bomb.batteries},(_,i)=>(<img key={i} className="pixel-art" alt="battery" src={batterySrc()} width={24} height={42}/>))}</span><span className="sticker"><img className="pixel-art" alt={bomb.sticker.name} src={stickerSrc(bomb.sticker)} width={48} height={48}/></span></div>
      <div className="strikes-display">{Array.from({length:maxStrikes},(_,i)=>(<span key={i} className={`strike-indicator ${i<strikes?"active":""}`}>{i<strikes?"❌":"⭕"}</span>))}<button className="mute-btn" aria-label={muted?"sound off":"sound on"} onClick={()=>{SFX.setMuted(!muted);setMuted(!muted);}}>{muted?"🔇":"🔊"}</button></div></div>
    <div className={`modules-grid ${dark?"lights-out":""}`}>{config.modules.map(mod=>(<ModuleWrapper key={mod.id} module={mod} serialNumber={serialNumber} bomb={bomb} locked={finaleLocked&&mod.id===config.finaleId} finale={mod.id===config.finaleId} onComplete={id=>{stat(id).solved=true;if(completed.length+1<config.modules.length)SFX.defuse();setCompleted(p=>[...p,id]);}} onStrike={()=>handleStrike(mod.id)}/>))}{config.fun&&<BombQuiz bomb={bomb} active={gameStatus==="playing"} onStrike={()=>handleStrike("fun")}/>}</div></div>);
};

      .manual-toggle{position:fixed;top:1rem;right:1rem;padding:0.5rem 1rem;border:1px solid #f1c40f;background:transparent;color:#f1c40f;cursor:pointer;z-index:100;font-family:'Share Tech Mono',monospace;border-radius:4px;transition:all 0.2s;}
      .manual-toggle.active{background:#f1c40f;color:#000;}
      .manual-overlay{position:fixed;top:0;right:-450px;width:min(420px,90vw);height:100vh;overflow-y:auto;z-index:90;box-shadow:-4px 0 30px rgba(0,0,0,0.7);transition:right 0.3s ease;}.manual-overlay.visible{right:0;}
      .bomb-container{background:linear-gradient(180deg,#1a1a2e 0%,#12101f 100%);border:3px solid #3a3560;border-radius:12px;padding:1.5rem;margin:1rem;box-shadow:0 0 60px rgba(102,126,234,0.15),inset 0 0 60px rgba(0,0,0,0.3);position:relative;}
      .bomb-container.shake{animation:shake 0.5s ease-in-out;}
      @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-10px);}40%{transform:translateX(10px);}60%{transform:translateX(-10px);}80%{transform:translateX(10px);}}
      .countdown-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:50;border-radius:12px;}
      .countdown-number{font-family:'Orbitron',sans-serif;font-size:6rem;font-weight:900;color:#ff4444;text-shadow:0 0 40px rgba(255,68,68,0.6);animation:countPulse 1s ease-in-out infinite;}
      @keyframes countPulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.2);opacity:0.8;}}
      .bomb-header{display:flex;justify-content:space-between;align-items:center;background:#1a1a2e;padding:1.25rem 1.5rem;border-radius:8px;margin-bottom:1.5rem;border:1px solid #333;flex-wrap:wrap;gap:0.75rem;}
      .timer-display{font-family:'Orbitron',sans-serif;font-size:2.5rem;font-weight:700;letter-spacing:2px;}
      .serial-display{font-size:0.9rem;color:#888;}.serial-label{margin-right:0.5rem;}
      .serial-value{font-family:'JetBrains Mono',monospace;font-size:1.1rem;color:#ffcc00;letter-spacing:2px;}
      .strikes-display{display:flex;gap:0.5rem;font-size:1.5rem;align-items:center;}.speed-badge{font-size:0.9rem;margin-left:0.6rem;color:#ff8800;text-shadow:none;letter-spacing:0;vertical-align:middle;}.mute-btn{margin-left:0.75rem;background:transparent;border:1px solid #444;border-radius:6px;font-size:1.1rem;padding:0.2rem 0.45rem;cursor:pointer;}.strike-indicator{opacity:0.3;transition:all 0.3s;}.strike-indicator.active{opacity:1;animation:strikeFlash 0.5s ease;}
      @keyframes strikeFlash{0%,100%{transform:scale(1);}50%{transform:scale(1.3);}}
      .modules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.25rem;margin-bottom:1.5rem;}
      .module-wrapper{background:#1a1a2e;border:2px solid #333;border-radius:8px;position:relative;overflow:hidden;transition:all 0.3s;}.module-wrapper.success{border-color:#4caf50;background:rgba(76,175,80,0.1);}
      .module-status-indicator{position:absolute;top:0.5rem;right:0.5rem;z-index:10;}
      .status-icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;background:#4caf50;color:#fff;border-radius:50%;font-size:1.2rem;font-weight:bold;}
      .status-dot{display:inline-block;width:12px;height:12px;background:#ffcc00;border-radius:50%;animation:pulse 1.5s ease-in-out infinite;}
      @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(0.8);}}
      .module-complete{position:absolute;inset:0;z-index:5;background:rgba(76,175,80,0.28);display:flex;align-items:center;justify-content:center;cursor:default;}.complete-badge{display:flex;align-items:center;gap:0.5rem;padding:0.4rem 0.9rem;background:rgba(10,21,32,0.85);border:2px solid #4caf50;border-radius:6px;color:#4caf50;font-family:'Orbitron',sans-serif;font-size:0.9rem;}.complete-icon{font-size:1.3rem;}
      .module-content{padding:1.25rem;}.module-content h3{font-family:'Orbitron',sans-serif;color:#ffcc00;margin-bottom:0.6rem;font-size:0.9rem;}.module-hint{color:#666;font-size:0.75rem;margin-bottom:0.75rem;}
      .wire-container{display:flex;flex-direction:column;gap:0.3rem;align-self:stretch;width:100%;box-sizing:border-box;flex:1;justify-content:center;padding:0.5rem;background:#4a4f5c;border:2px solid #333;border-radius:6px;}.wire{display:block;width:100%;padding:0;background:none;border:none;cursor:pointer;}.wire img{width:100%;}.wire:hover:not(:disabled) img{filter:brightness(1.15) drop-shadow(0 0 2px #0ff);}.wire:disabled{cursor:default;}
      .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;}
      .option-btn{padding:0.6rem;background:#1a1a2e;border:1px solid #333;color:#0ff;cursor:pointer;border-radius:4px;font-family:'Share Tech Mono',monospace;font-size:0.8rem;font-weight:bold;transition:all 0.2s;}.option-btn:hover:not(:disabled):not(.correct){border-color:#0ff;background:rgba(0,255,255,0.05);}.option-btn.correct{background:#4caf50;border-color:#4caf50;color:#fff;}.option-btn:disabled{cursor:default;}
      .symbol-btn{padding:0.8rem;font-size:1.8rem;background:#1a1a2e;border:1px solid #333;border-radius:4px;cursor:pointer;transition:all 0.2s;}.symbol-btn:hover:not(:disabled):not(.correct){border-color:#0ff;}.symbol-btn.correct{background:#4caf50;border-color:#4caf50;}.symbol-btn:disabled{cursor:default;}
      .keypad-display{background:#0a1520;padding:0.6rem;border-radius:4px;margin-bottom:0.5rem;color:#0f0;font-size:1rem;letter-spacing:0.2rem;text-align:center;}
      .keypad-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:0.3rem;}
      .keypad-btn{padding:0.6rem;background:#1a2a3a;border:1px solid #0ff3;color:#0ff;border-radius:4px;cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:1rem;transition:all 0.2s;}.keypad-btn.used{background:#0a1520;color:#333;cursor:default;}
      .clear-btn{margin-top:0.3rem;padding:0.3rem 0.8rem;background:transparent;border:1px solid #f55;color:#f55;border-radius:4px;cursor:pointer;font-size:0.7rem;font-family:'Share Tech Mono',monospace;}
      .switch-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;}
      .switch-btn{padding:0.75rem;border:3px solid transparent;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0.25rem;transition:all 0.2s;}.switch-btn.solved{border-color:#4caf50;opacity:0.7;cursor:default;}.switch-btn:hover:not(.solved){transform:scale(1.05);}
      .switch-arrow{font-size:1.5rem;}.switch-dir-label{font-size:0.6rem;text-transform:uppercase;}
      .monster-display{background:#0a1520;border-radius:8px;padding:0.5rem;text-align:center;margin-bottom:0.75rem;border:2px solid #333;}.pixel-art{image-rendering:pixelated;max-width:100%;height:auto;display:block;margin:0 auto;}
      .clock-btn{padding:0.3rem 0.8rem;background:#1a2a3a;border:1px solid #0ff3;color:#0ff;cursor:pointer;border-radius:4px;font-family:'Share Tech Mono',monospace;transition:all 0.2s;}.clock-btn:hover{background:rgba(0,255,255,0.1);}
      .submit-btn{width:100%;padding:0.6rem;background:rgba(0,255,255,0.1);border:1px solid #0ff;color:#0ff;border-radius:4px;cursor:pointer;font-family:'Orbitron',sans-serif;font-weight:bold;font-size:0.85rem;transition:all 0.2s;}.submit-btn:hover:not(:disabled){background:rgba(0,255,255,0.2);}.submit-btn.correct{background:#4caf50;border-color:#4caf50;color:#fff;cursor:default;}
      .manual-page-content{padding:2rem;max-width:600px;margin:0 auto;font-family:Georgia,'Times New Roman',serif;color:#222;background:#f5f0e6;min-height:100vh;line-height:1.6;}
      .manual-title{text-align:center;border-bottom:3px double #333;padding-bottom:0.5rem;font-size:1.4rem;font-family:Georgia,serif;}
      .manual-subtitle{text-align:center;font-style:italic;color:#666;font-size:0.75rem;margin-bottom:1.5rem;}
      .manual-section{margin-bottom:0.5rem;border:1px solid #ddd;border-radius:6px;overflow:hidden;}
      .manual-section h2{font-size:1rem;padding:0.75rem;margin:0;background:#e8e0d0;border-bottom:1px solid #ddd;user-select:none;}
      .manual-section h2:hover{background:#ddd8c8;}
      .manual-section>div{padding:0.75rem;}
      .manual-section p{font-size:0.8rem;margin-bottom:0.3rem;}.manual-list{font-size:0.7rem;color:#555;line-height:1.8;}
      .manual-table{width:100%;border-collapse:collapse;font-size:0.75rem;margin:0.5rem 0;}
      .manual-table th,.manual-table td{border:1px solid #999;padding:0.3rem;text-align:center;}
      .manual-table th{background:#ddd;font-weight:bold;}
      .color-cell{color:#fff;font-weight:bold;}.color-cell.red{background:#e74c3c;}.color-cell.blue{background:#3498db;}.color-cell.yellow{background:#f1c40f;color:#333;}.color-cell.green{background:#2ecc71;}
      .game-over-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem;position:relative;overflow:hidden;}
      .game-over-screen h1{font-family:'Orbitron',sans-serif;font-size:2.5rem;margin-bottom:1rem;z-index:1;}
      .game-over-screen.win h1{color:#4caf50;text-shadow:0 0 30px rgba(76,175,80,0.5);}.game-over-screen.lose h1{color:#ff4444;text-shadow:0 0 30px rgba(255,68,68,0.5);}
      .result-time{color:#ffcc00;font-size:1.2rem;margin-bottom:0.5rem;z-index:1;}.result-reason{color:#ff8800;font-size:1.2rem;margin-bottom:0.5rem;z-index:1;}.result-message{color:#888;font-size:1rem;margin-bottom:2rem;z-index:1;}
      .play-again-btn{padding:1rem 3rem;border:none;font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:bold;cursor:pointer;letter-spacing:2px;transition:all 0.3s;z-index:1;border-radius:4px;}
      .play-again-btn.win{background:#4caf50;color:#000;}.play-again-btn.win:hover{box-shadow:0 0 30px rgba(76,175,80,0.5);transform:scale(1.05);}
      .play-again-btn.lose{background:#ff4444;color:#fff;}.play-again-btn.lose:hover{box-shadow:0 0 30px rgba(255,68,68,0.5);transform:scale(1.05);}
      .result-team{font-family:'Orbitron',sans-serif;color:#ffcc00;letter-spacing:2px;margin-bottom:0.75rem;z-index:1;}
      .stars-row{font-size:4rem;line-height:1;margin:0.25rem 0 0.5rem;z-index:1;}.star{color:#333;display:inline-block;margin:0 0.2rem;}.star.on{color:#333;animation:starPop 0.5s ease forwards;}
      @keyframes starPop{0%{transform:scale(0.3);color:#333;}60%{transform:scale(1.5);color:#ffe066;}100%{transform:scale(1);color:#ffcc00;text-shadow:0 0 25px rgba(255,204,0,0.7);}}
      .new-best{font-family:'Orbitron',sans-serif;color:#ffcc00;z-index:1;margin-bottom:0.5rem;animation:titlePulse 1s ease-in-out infinite;}.old-best{color:#888;z-index:1;margin-bottom:0.5rem;}
      .result-card{z-index:1;background:rgba(20,20,35,0.9);border:1px solid #333;border-radius:8px;padding:0.75rem 1.25rem;margin:0.4rem 0;width:min(440px,92vw);text-align:left;}
      .check-row,.mod-row{display:flex;gap:0.6rem;align-items:center;padding:0.25rem 0;color:#777;}.check-row.ok{color:#eee;}.check-row em{color:#888;font-style:normal;font-size:0.85em;}
      .mod-row{color:#ddd;}.mod-name{flex:1;}.mod-x{font-size:0.8rem;}
      .result-buttons{display:flex;flex-direction:column;gap:0.6rem;margin-top:1rem;z-index:1;width:min(440px,92vw);}
      .play-again-btn.plain{background:#2a2a45;color:#eee;border:1px solid #555;}.play-again-btn.ghost{background:transparent;color:#888;border:1px solid #444;padding:0.6rem;font-size:0.9rem;}
      .team-btn{font-family:'Orbitron',sans-serif;font-size:1rem;padding:0.6rem 1rem;background:rgba(255,204,0,0.08);border:1px dashed #ffcc00;color:#ffcc00;cursor:pointer;letter-spacing:1px;}.team-btn span{display:block;font-family:'Share Tech Mono',monospace;font-size:0.65rem;color:#998;letter-spacing:0;margin-top:0.15rem;}
      .menu-btn.tertiary{border-color:#666;color:#888;font-size:0.85rem;padding:0.6rem 2rem;}.menu-btn.tertiary:hover{background:#666;color:#000;}
      .team-tag{color:#ffcc00;font-family:'Orbitron',sans-serif;font-size:0.8rem;margin-bottom:0.2rem;letter-spacing:1px;}
      .mission-total{text-align:center;color:#ffcc00;font-family:'Orbitron',sans-serif;font-size:1.3rem;margin:-1rem 0 1.25rem;}
      .mission-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0.75rem;}
      .mission-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:0.25rem;padding:0.9rem 0.5rem;background:#1a1a2e;border:2px solid #333;border-radius:8px;color:#ccc;cursor:pointer;font-family:'Share Tech Mono',monospace;transition:all 0.2s;}
      .mission-card:hover{border-color:#888;transform:translateY(-2px);}.mission-card.done{border-color:#4caf50;}.mission-card.next{border-color:#ffcc00;box-shadow:0 0 18px rgba(255,204,0,0.25);}
      .mission-num{font-family:'Orbitron',sans-serif;font-size:1.8rem;font-weight:900;color:#ff4444;}.mission-name{font-size:0.95rem;color:#eee;}
      .mission-stars{color:#ffcc00;font-size:1.2rem;letter-spacing:2px;}.mission-stars i{color:#333;font-style:normal;}.mission-meta{font-size:0.65rem;color:#777;}
      .mission-next{position:absolute;top:-0.6rem;right:-0.4rem;background:#ffcc00;color:#000;font-size:0.6rem;font-weight:bold;padding:0.1rem 0.4rem;border-radius:4px;}
      .locked-module{min-height:180px;display:flex;align-items:center;justify-content:center;border-style:dashed;background:repeating-linear-gradient(45deg,#16162a,#16162a 12px,#1c1c33 12px,#1c1c33 24px);}
      .lock-face{text-align:center;color:#888;padding:1rem;}.lock-icon{font-size:3rem;}.lock-title{font-family:'Orbitron',sans-serif;color:#ffcc00;margin:0.4rem 0 0.2rem;letter-spacing:2px;}.lock-sub{font-size:0.8rem;}
      .module-wrapper.finale:not(.success){border-color:#ff8800;box-shadow:0 0 22px rgba(255,136,0,0.35);animation:finaleIn 0.6s ease;}
      @keyframes finaleIn{0%{transform:scale(0.92);}60%{transform:scale(1.04);}100%{transform:scale(1);}}
      .bomb-container{border-width:4px;}
      .bomb-plate{display:flex;align-items:center;gap:0.9rem;}.battery-row{display:flex;gap:3px;align-items:flex-end;}
      .sticker{display:inline-flex;background:#f6f4ef;border-radius:8px;padding:4px;transform:rotate(-6deg);box-shadow:1px 2px 4px rgba(0,0,0,0.5);}
      .modules-grid{transition:filter 0.25s;}.modules-grid.lights-out{filter:brightness(0.06);animation:flicker 0.5s steps(2) 1;}
      @keyframes flicker{0%{filter:brightness(1);}25%{filter:brightness(0.06);}50%{filter:brightness(0.8);}100%{filter:brightness(0.06);}}
      .quiz-box{border-style:dashed;}.quiz-box.awake{border-color:#ff8800;border-style:solid;box-shadow:0 0 22px rgba(255,136,0,0.4);animation:finaleIn 0.5s ease;}
      .quiz-text{font-size:1.15rem;color:#fff;text-align:center;margin:0.25rem 0 0.6rem;line-height:1.4;}.quiz-sleep{text-align:center;font-size:2.5rem;opacity:0.5;padding:1rem 0;}
      .quiz-bar{height:8px;background:#333;border-radius:4px;overflow:hidden;margin-bottom:0.75rem;}.quiz-bar span{display:block;height:100%;background:#ff8800;transition:width 1s linear;}
      .alarm-clock{position:fixed;right:1.25rem;bottom:1.25rem;z-index:80;display:flex;flex-direction:column;align-items:center;gap:0.1rem;padding:0.75rem 1rem;background:#ff4444;color:#fff;border:3px solid #fff;border-radius:16px;font-family:'Orbitron',sans-serif;font-weight:bold;cursor:pointer;animation:alarmShake 0.15s linear infinite;}
      .alarm-clock span{font-size:3rem;line-height:1;}
      @keyframes alarmShake{0%{transform:rotate(-7deg);}50%{transform:rotate(7deg);}100%{transform:rotate(-7deg);}}
      .fun-row{display:flex;align-items:center;gap:0.75rem;margin-top:1.5rem;color:#888;font-size:0.75rem;flex-wrap:wrap;}
      .test-tools{display:flex;gap:0.3rem;padding:0.25rem;background:#3a3200;}.test-tools button{flex:1;font-size:0.65rem;padding:0.2rem;background:#f1c40f;border:none;cursor:pointer;font-family:'Share Tech Mono',monospace;}
      .finale-tag{background:#ff8800;color:#000;font-family:'Orbitron',sans-serif;font-size:0.7rem;font-weight:bold;text-align:center;padding:0.2rem;letter-spacing:2px;}
      .manual-filter{display:flex;flex-wrap:wrap;gap:0.35rem;align-items:center;justify-content:center;padding:3.5rem 1rem 0.5rem;font-size:0.8rem;color:#aaa;}
      .manual-filter button{min-width:2.2rem;padding:0.4rem 0.6rem;background:#1a1a2e;border:1px solid #444;color:#aaa;cursor:pointer;font-family:'Share Tech Mono',monospace;border-radius:4px;}.manual-filter button.active{background:#f1c40f;border-color:#f1c40f;color:#000;font-weight:bold;}
      .manual-filter em{flex-basis:100%;text-align:center;font-style:normal;color:#f1c40f;}
      .confetti-bg{position:absolute;inset:0;background:radial-gradient(circle,rgba(76,175,80,0.15) 0%,transparent 70%);animation:bgPulse 2s ease-in-out infinite;}
      .explosion-bg{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,100,0,0.2) 0%,transparent 70%);animation:bgPulse 2s ease-in-out infinite;}
      @keyframes bgPulse{0%,100%{transform:scale(1);opacity:0.5;}50%{transform:scale(1.3);opacity:0.3;}}
      @media(max-width:768px){.game-title{font-size:2rem;}.bomb-icon{font-size:5rem;}.bomb-header{flex-direction:column;text-align:center;}.timer-display{font-size:2rem;}.modules-grid{grid-template-columns:1fr;}.manual-overlay{width:100%;}.menu-btn{padding:0.8rem 2rem;font-size:0.9rem;}.settings-panel{margin:1rem;padding:1.5rem;}}
    `}</style>
    {screen==="menu"&&(<div className="menu-screen"><div className="bomb-icon">💣</div><h1 className="game-title">ESL BOMB SQUAD</h1><p className="game-subtitle">Communication Under Pressure</p>{TEST_MODE&&<p style={{color:"#f1c40f",marginTop:"-2rem",marginBottom:"2rem",letterSpacing:"3px"}}>TEST MODE</p>}<div className="menu-buttons"><button className="team-btn" onClick={nextTeam}>TEAM: {team[0]} {team[1]} <span>tap to change</span></button><button className="menu-btn primary" onClick={()=>setScreen("missions")}>🎯 MISSIONS</button><button className="menu-btn secondary" onClick={()=>{setManualOnly(null);setScreen("manual-only");}}>📖 EXPERT MANUAL</button><button className="menu-btn tertiary" onClick={()=>setScreen("settings")}>🛠 FREE PLAY</button></div></div>)}
    {screen==="missions"&&(<div><button className="back-btn" onClick={()=>setScreen("menu")}>← Back</button><MissionSelect progress={progress} fun={fun} setFun={setFun} onPick={m=>startGame({mission:m,fun})}/></div>)}
    {screen==="settings"&&(<div><button className="back-btn" onClick={()=>setScreen("menu")}>← Back</button><SettingsPanel onStartGame={startGame} fun={fun} setFun={setFun}/></div>)}
    {screen==="playing"&&config&&(<div className="game-layout"><button className="back-btn" onClick={reset}>← Quit</button>{TEST_MODE&&<button className={`manual-toggle ${showManual?"active":""}`} onClick={()=>setShowManual(!showManual)}>{showManual?"✕ Close Manual":"📖 Manual (TEST)"}</button>}<BombComponent key={gameKey} config={config} team={team} onGameEnd={endGame}/>{TEST_MODE&&<div className={`manual-overlay ${showManual?"visible":""}`}><ExpertManual only={[...new Set(config.modules.map(m=>m.baseId))]}/></div>}</div>)}
    {screen==="manual-only"&&(<div><button className="back-btn" onClick={()=>setScreen("menu")}>← Back</button>
      <div className="manual-filter"><span>SHOW:</span><button className={!manualOnly?"active":""} onClick={()=>setManualOnly(null)}>ALL</button>{manualOnly&&!manualOnly.label.startsWith("MISSION")&&<button className="active">{manualOnly.label}</button>}{MISSIONS.map(m=>(<button key={m.id} className={manualOnly&&manualOnly.label===`MISSION ${m.num}`?"active":""} onClick={()=>setManualOnly({label:`MISSION ${m.num}`,ids:m.modules})}>{m.num}</button>))}{manualOnly&&manualOnly.label.startsWith("MISSION")&&<em>{manualOnly.label}: {MISSIONS[Number(manualOnly.label.slice(8))-1].name}</em>}</div>
      <ExpertManual key={manualOnly?manualOnly.label:"all"} only={manualOnly?manualOnly.ids:null}/></div>)}
    {screen==="result"&&gameResult&&config&&<ResultsScreen result={gameResult.result} best={gameResult.best} isNewBest={gameResult.isNewBest} config={config} team={team} onReplay={()=>{SFX.unlock();startGame(config.spec);}} onSwap={()=>openManualFor(config)} onNext={nextMission?()=>startGame({mission:nextMission,fun:config.fun}):null} onMenu={reset}/>}
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
